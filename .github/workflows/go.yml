name: Go

on:
  push:
    paths: ["go/**", ".github/workflows/go.yml"]
  pull_request:
    paths: ["go/**", ".github/workflows/go.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
      - run: make check
